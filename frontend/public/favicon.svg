<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F9ECEF" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .logo-text {
        font-family: 'Great Vibes', cursive;
        fill: #9E5E6F;
        font-size: 280px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Background Circle with elegant subtle border -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="#9E5E6F" stroke-width="12" stroke-opacity="0.25" />
  
  <!-- Cursive initials 'EM' -->
  <text x="256" y="240" class="logo-text">EM</text>
</svg>
